# Conda environment for DynED-Imb_v2 (LSH-DynED)
# Verified working on macOS arm64 (Apple Silicon), 2026-06.
#
# Create:   conda env create -f environment.yml
# Activate: conda activate dyned-imb
#
# Run the model (canonical entry point; needs project root + Model/ on PYTHONPATH):
#   PYTHONPATH=. conda run -n dyned-imb python Model/Main-newreaddata.py
#
# Python 3.10 is required by the package set: river 0.21.x (the API this code
# targets: river.drift.adwin.ADWIN, predict_proba_one, .drift_detected) needs
# Python >=3.9, and faiss-cpu has its most reliable conda-forge builds on <=3.11.
# numpy is held <2 for faiss / disarray / legacy-idiom compatibility.
name: dyned-imb
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy<2
  - faiss-cpu
  - scikit-learn
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - tqdm
  - joblib
  - openpyxl
  - multipledispatch
  - sortedcontainers
  - pip
  - pip:
      - river==0.21.2          # pinned: code targets the 0.21.x API
      - imbalanced-learn==0.14.2
      - disarray==0.2.0        # df.da.* confusion-matrix accessor (PyPI only)
      - autorank==1.3.0
      - scikit-posthocs==0.14.0
